<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; width: 300px; background: #151515; color: #f2f2f2; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #262626; }
  header img { width: 24px; height: 24px; border-radius: 6px; }
  h1 { font-size: 14px; margin: 0; }
  .status { color: #9a9a9a; font-size: 11px; margin-top: 2px; }
  section { padding: 14px 16px; }
  .site { font-weight: 600; word-break: break-all; margin-bottom: 4px; }
  .hint { color: #9a9a9a; font-size: 11px; line-height: 1.4; margin-bottom: 10px; }
  button { width: 100%; padding: 8px; border-radius: 999px; border: 0; font-size: 13px; font-weight: 500; cursor: pointer; background: #fff; color: #000; }
  button.secondary { background: #2a2a2a; color: #f2f2f2; }
  ul { list-style: none; padding: 0; margin: 8px 0 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; color: #cfcfcf; font-size: 12px; }
  li button { width: auto; padding: 2px 10px; font-size: 11px; }
  a { color: #8ab4ff; font-size: 11px; }
</style>
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <div><h1>Haven</h1><div class="status" id="status">…</div></div>
</header>
<section>
  <div class="site" id="site"></div>
  <div class="hint" id="hint"></div>
  <button id="toggle"></button>
</section>
<section style="border-top:1px solid #262626">
  <div class="hint" style="margin:0">Connected sites</div>
  <ul id="sites"></ul>
  <p><a href="options.html" target="_blank">Pairing and settings</a></p>
</section>
<script src="popup.js"></script>
</body>
</html>
