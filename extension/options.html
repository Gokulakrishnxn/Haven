<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Haven pairing</title>
<style>
  :root { color-scheme: dark; }
  body { background: #151515; color: #f2f2f2; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; max-width: 520px; margin: 48px auto; padding: 0 20px; }
  h1 { font-size: 22px; }
  p { color: #b5b5b5; line-height: 1.5; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 1px solid #333; background: #1d1d1d; color: #fff; font: 13px ui-monospace, monospace; }
  button { margin-top: 12px; padding: 9px 18px; border-radius: 999px; border: 0; background: #fff; color: #000; font-weight: 500; cursor: pointer; }
  .status { margin-top: 16px; color: #9a9a9a; }
</style>
</head>
<body>
<h1>Pair with Haven</h1>
<p>In the Haven app, open <b>Settings &gt; Browser</b>, copy the pairing code, and paste it here. The code stays on this Mac.</p>
<input id="token" placeholder="Pairing code" spellcheck="false" autocomplete="off">
<button id="save">Save</button>
<div class="status" id="status"></div>
<script src="options.js"></script>
</body>
</html>
